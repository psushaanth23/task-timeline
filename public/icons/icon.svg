<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#090a0e"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- vertical timeline rail -->
  <rect x="150" y="104" width="10" height="304" rx="5" fill="url(#mint)" opacity="0.5"/>
  <!-- three task nodes -->
  <circle cx="155" cy="150" r="26" fill="#0b1016" stroke="url(#mint)" stroke-width="10"/>
  <circle cx="155" cy="256" r="26" fill="#0b1016" stroke="url(#mint)" stroke-width="10"/>
  <circle cx="155" cy="362" r="26" fill="#0b1016" stroke="url(#mint)" stroke-width="10"/>
  <!-- task bars -->
  <rect x="210" y="134" width="190" height="32" rx="10" fill="url(#mint)" opacity="0.9"/>
  <rect x="210" y="240" width="150" height="32" rx="10" fill="url(#mint)" opacity="0.65"/>
  <rect x="210" y="346" width="120" height="32" rx="10" fill="url(#mint)" opacity="0.45"/>
  <!-- check on the first (done) node -->
  <path d="M143 150 l9 9 l16 -18" fill="none" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
